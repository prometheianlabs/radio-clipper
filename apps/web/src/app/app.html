<!-- Top-level shell for slice-01 auth and route placeholders. -->
<main class="app-shell">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="topbar">
    <div class="brand-block">
      <p class="eyebrow">Radio Clipper v1</p>
      <h1>Broadcast Console</h1>
      <p class="tagline">Live operations for modern stations with heritage studio character</p>
    </div>

    <!-- Session controls are visible only when the in-memory auth shell has a user. -->
    @if (bIsSignedIn()) {
      <div class="session-bar">
        <span class="role-pill">{{ sRole() }}</span>
        <nav>
          <a routerLink="/live" routerLinkActive="active">Live desk</a>
          <a routerLink="/admin" routerLinkActive="active">Admin</a>
        </nav>
        <button type="button" (click)="fnSignOut()">Sign out</button>
      </div>
    }
  </header>

  <!-- Routed page content renders inside the shared frame. -->
  <section class="content-frame" id="main-content" tabindex="-1">
    <router-outlet />
  </section>
</main>
